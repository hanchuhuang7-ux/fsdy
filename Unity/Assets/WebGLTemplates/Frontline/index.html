<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阵线实验室 · Unity Edition</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d28;color:#e9ece8;font-family:system-ui,sans-serif}#unity-canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#101d28}h1{font-size:24px;letter-spacing:3px;font-weight:500;margin:0;color:#efba68}small{color:#9fb0b8}progress{width:min(280px,75vw);accent-color:#efba68}#error{max-width:80vw;white-space:pre-wrap;color:#f4ac8b}</style></head>
<body><canvas id="unity-canvas" tabindex="-1" aria-label="阵线实验室 Unity 游戏"></canvas><div id="loading"><small>FRONTLINE LAB / UNITY EDITION</small><h1>阵线实验室</h1><progress id="bar" max="1" value="0"></progress><small id="state">正在载入战场…</small><div id="error"></div></div>
<script>
const buildUrl="Build",canvas=document.querySelector('#unity-canvas');
const config={dataUrl:buildUrl+"/{{{ DATA_FILENAME }}}",frameworkUrl:buildUrl+"/{{{ FRAMEWORK_FILENAME }}}",codeUrl:buildUrl+"/{{{ CODE_FILENAME }}}",streamingAssetsUrl:"StreamingAssets",companyName:"Frontline Lab",productName:"Frontline Lab",productVersion:"0.9.0",matchWebGLToCanvasSize:true,devicePixelRatio:new URLSearchParams(location.search).has("frontlineQA")?1:Math.min(devicePixelRatio,2)};
const script=document.createElement('script');script.src=buildUrl+"/{{{ LOADER_FILENAME }}}";script.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('#bar').value=p).then(instance=>{window.frontlineUnity=instance;document.querySelector('#loading').style.display='none';canvas.focus()}).catch(e=>{document.querySelector('#state').textContent='载入失败';document.querySelector('#error').textContent=String(e)});script.onerror=()=>document.querySelector('#error').textContent='无法下载游戏，请刷新重试。';document.body.appendChild(script);
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Tab')&&e.target===canvas)e.preventDefault()});
</script></body></html>
